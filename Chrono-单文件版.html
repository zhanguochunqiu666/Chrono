<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="时序 Chrono:把「接下来该做什么」交给系统去算的个人时间调度。">
<style>
/* 时序 Chrono · 样式 v3
   方向:iOS 27 精修版 Liquid Glass —— 彩色光晕底 + 半透明玻璃面 + 亮边/暗边双层描边 + 悬浮胶囊导航。
   透明度可在「设置 → 液态玻璃」里从「通透」调到「磨砂」(与 iOS 27 的滑块同思路)。
   唯一的强调色仍是钴蓝的「现在线」。 */
:root {
  --ink: #141A24; --ink2: #475262; --ink3: #8591A3;
  --now: #2F4BF2; --nowtint: rgba(47,75,242,.10);
  --gl: 255,255,255;                       /* 玻璃底色 RGB */
  --ga: .62; --gb: 24px;                   /* 玻璃不透明度 / 模糊半径(由设置滑块写入) */
  --hi: rgba(255,255,255,.9);              /* 上沿高光 */
  --edge: rgba(20,30,60,.10);              /* 暗边 */
  --rule: rgba(20,30,60,.10); --rule2: rgba(20,30,60,.06);
  --fill: rgba(110,120,145,.12);           /* 输入框等「凹」的填充 */
  --paper: #EEF1F7; --card: rgba(var(--gl), var(--ga));
  --bg: radial-gradient(62% 42% at 8% -4%, rgba(110,150,255,.42), transparent 70%), radial-gradient(52% 40% at 104% 6%, rgba(255,160,190,.34), transparent 70%), radial-gradient(64% 50% at 86% 104%, rgba(90,215,190,.30), transparent 70%), radial-gradient(50% 40% at -6% 96%, rgba(255,205,140,.26), transparent 70%), #EDF0F6;
  --lift: 0 1px 1px rgba(20,30,60,.04), 0 14px 34px -16px rgba(30,45,90,.34);
  --hero-fg: #fff;
  --nav-h: 66px; --nav-gap: 12px; --cap-h: 64px; --rail: 214px;
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Noto Sans CJK SC", system-ui, sans-serif;
  --spring: cubic-bezier(.2, .9, .3, 1.12);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #EEF2F8; --ink2: #AAB4C4; --ink3: #74809A;
    --now: #8EA0FF; --nowtint: rgba(142,160,255,.14);
    --gl: 52,60,80; --hi: rgba(255,255,255,.22); --edge: rgba(0,0,0,.45);   /* iOS 27:暗色玻璃更亮,边缘更深 */
    --rule: rgba(255,255,255,.12); --rule2: rgba(255,255,255,.07); --fill: rgba(255,255,255,.09);
    --paper: #0C111B;
    --bg: radial-gradient(60% 42% at 8% -4%, rgba(80,110,230,.40), transparent 70%), radial-gradient(52% 40% at 104% 6%, rgba(200,90,150,.28), transparent 70%), radial-gradient(64% 50% at 86% 104%, rgba(40,160,150,.26), transparent 70%), #0C111B;
    --lift: 0 1px 1px rgba(0,0,0,.3), 0 16px 38px -16px rgba(0,0,0,.7);
  }
}
@media (prefers-reduced-transparency: reduce) { :root { --ga: .97; --gb: 0px; --bg: var(--paper); } }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { :root { --ga: .93; } }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--font); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
body { background: var(--bg) fixed; background-color: var(--paper); }
button, input, select, textarea { font: inherit; color: inherit; }
input, select, textarea { font-size: 16px; }
button { cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--now); outline-offset: 2px; border-radius: 10px; }
[hidden] { display: none !important; }

/* 玻璃面:同一套配方,所有「浮起来的」东西共用 */
.glass, .card, .ringc, .rc, .opt, .banner, .wk, .dlchip, #nav, #capture .bar, .sheet, .iconbtn, .btn, .chip, #toast, .askcard, .tag-note {
  background: rgba(var(--gl), var(--ga));      /* 直接引用,才能让 .sheet / #toast 的局部 --ga 生效 */
  -webkit-backdrop-filter: blur(var(--gb)) saturate(1.8); backdrop-filter: blur(var(--gb)) saturate(1.8);
  border: .5px solid var(--hi);
  box-shadow: inset 0 1px 0 var(--hi), inset 0 -1px 0 rgba(0,0,0,.04), 0 0 0 .5px var(--edge), var(--lift);
}

#app { display: flex; flex-direction: column; min-height: 100vh; }
#main { flex: 1; width: 100%; max-width: 760px; margin: 0 auto; padding: calc(var(--safe-t) + 14px) 16px calc(var(--nav-h) + var(--nav-gap) + var(--cap-h) + var(--safe-b) + 30px); }
body.nocap #main { padding-bottom: calc(var(--nav-h) + var(--nav-gap) + var(--safe-b) + 30px); }

/* 悬浮胶囊导航 */
#nav { position: fixed; z-index: 30; left: 14px; right: 14px; bottom: calc(var(--safe-b) + var(--nav-gap)); display: flex; height: var(--nav-h); padding: 6px; border-radius: 34px; max-width: 520px; margin: 0 auto; gap: 2px; }
#nav button { flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--ink2); font-size: 11px; font-weight: 600; border-radius: 28px; position: relative; transition: background .3s var(--spring), color .2s, transform .3s var(--spring); }
#nav button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
#nav button[aria-current="page"] { color: var(--now); background: rgba(var(--gl), .55); box-shadow: inset 0 1px 0 var(--hi), 0 0 0 .5px var(--edge), 0 6px 16px -8px rgba(30,45,90,.4); }
#nav button[aria-current="page"] svg { stroke-width: 2.1; }
#nav button:active { transform: scale(.94); }
#nav .brand { display: none; }

/* 顶部:大标题 */
#top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 2px 14px; }
#top h1 { margin: 0; font-size: 34px; line-height: 1.1; letter-spacing: -.02em; font-weight: 800; }
#top .sub { color: var(--ink2); font-size: 14px; margin-top: 4px; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--ink2); padding: 0; }
.iconbtn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* 通用 */
.card { border-radius: 24px; padding: 16px 18px; }
.card + .card, .stack > * + * { margin-top: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--ink2); } .faint { color: var(--ink3); } .small { font-size: 13px; } .tiny { font-size: 12px; }
.num { font-weight: 700; letter-spacing: -.02em; }
h2 { margin: 26px 6px 10px; font-size: 20px; font-weight: 750; letter-spacing: -.01em; }
h2 .aux { font-weight: 400; color: var(--ink3); font-size: 13px; margin-left: 8px; letter-spacing: 0; }
.btn { border-radius: 999px; padding: 9px 18px; font-weight: 650; font-size: 15px; min-height: 44px; transition: transform .25s var(--spring); }
.btn:active { transform: scale(.96); }
.btn.pri { background: var(--ink); color: var(--paper); border-color: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 10px 22px -10px rgba(10,20,50,.6); }
.btn.now { background: linear-gradient(180deg, color-mix(in srgb, var(--now) 88%, #fff), var(--now)); color: #fff; border-color: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 10px 22px -10px var(--now); }
.btn.ghost { background: none; border-color: transparent; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; color: var(--ink2); }
.btn.sm { padding: 5px 14px; min-height: 34px; font-size: 13.5px; }
.btn.warn { color: #B3541A; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 12px; font-size: 13.5px; min-height: 30px; box-shadow: inset 0 1px 0 var(--hi), 0 0 0 .5px var(--edge); }
.chip[aria-pressed="true"], .chip.on { background: var(--ink); color: var(--paper); -webkit-backdrop-filter: none; backdrop-filter: none; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.banner { border-radius: 20px; padding: 12px 14px; margin-bottom: 10px; font-size: 14px; position: relative; overflow: hidden; }
.banner::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 4px; border-radius: 0 4px 4px 0; background: var(--now); }
.banner.calm::before { background: #E0A020; }
.empty { text-align: center; color: var(--ink2); padding: 28px 12px; }
.empty b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 4px; }
input[type=text], input[type=search], input[type=number], input[type=time], input[type=date], input[type=datetime-local], input[type=password], select, textarea {
  border: 0; background: var(--fill); border-radius: 14px; padding: 9px 14px; min-height: 44px; width: 100%; box-shadow: inset 0 1px 2px rgba(0,0,0,.06); }
select { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink3) 50%), linear-gradient(135deg, var(--ink3) 50%, transparent 50%); background-position: calc(100% - 20px) 55%, calc(100% - 14px) 55%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 36px; }
label.field { display: block; font-size: 13px; color: var(--ink2); margin: 12px 6px 5px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 2px; border-bottom: .5px solid var(--rule); }
/* iOS 开关 */
input[type=checkbox] { appearance: none; -webkit-appearance: none; width: 51px !important; height: 31px !important; min-height: 0 !important; border-radius: 16px; background: rgba(120,128,150,.32); position: relative; flex: none; transition: background .25s; cursor: pointer; border: 0; padding: 0; box-shadow: inset 0 0 0 .5px var(--edge); }
input[type=checkbox]::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,.28); transition: transform .3s var(--spring); }
input[type=checkbox]:checked { background: #34C759; }
input[type=checkbox]:checked::after { transform: translateX(20px); }
input[type=range] { -webkit-appearance: none; appearance: none; height: 28px; background: none; box-shadow: none; padding: 0; min-height: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, rgba(120,128,150,.35), var(--now)); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, rgba(120,128,150,.35), var(--now)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 22px; margin-top: -8px; border-radius: 11px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.3), inset 0 0 0 .5px rgba(0,0,0,.1); }
input[type=range]::-moz-range-thumb { width: 30px; height: 22px; border-radius: 11px; background: #fff; border: 0; box-shadow: 0 2px 8px rgba(0,0,0,.3); }

/* 今天:日期头与日期条 */
.datehead { display: flex; align-items: center; gap: 12px; }
.bigday { font-size: 62px; font-weight: 800; line-height: .88; letter-spacing: -.055em; }
.dm .dw { font-size: 18px; font-weight: 750; }
.dm .ym { font-size: 13px; color: var(--ink2); }
.donering { width: 44px; height: 44px; }
.subline { color: var(--ink2); font-size: 14.5px; margin: -4px 6px 14px; }
.strip { display: flex; gap: 2px; align-items: stretch; margin-bottom: 14px; padding: 5px; border-radius: 28px; }
.strip .sn { width: 24px; border: 0; background: none; color: var(--ink3); font-size: 22px; padding: 0; }
.sd { flex: 1; min-width: 0; border: 0; background: none; border-radius: 22px; padding: 7px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 1px; transition: background .3s var(--spring), transform .3s var(--spring); }
.sd .w { font-size: 11.5px; color: var(--ink3); }
.sd .n { font-size: 18px; font-weight: 750; }
.sd.td:not(.on) .n { color: var(--now); }
.sd.on { background: var(--ink); color: var(--paper); box-shadow: 0 8px 18px -8px rgba(10,20,50,.6), inset 0 1px 0 rgba(255,255,255,.25); }
.sd.on .w { color: inherit; opacity: .7; }
.sd .ld { width: 4px; height: 12px; border-radius: 2px; background: var(--rule); position: relative; overflow: hidden; margin-top: 3px; }
.sd .ld b { position: absolute; left: 0; right: 0; bottom: 0; background: var(--ink3); }
.sd .ld.over b { background: #E0A020; }
.sd.on .ld { background: rgba(255,255,255,.25); } .sd.on .ld b { background: var(--paper); }
.sd.has::after { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--now); margin-top: 1px; }
.sd.away { opacity: .55; }

/* 英雄卡:带领域色的液态玻璃 */
.hero { position: relative; overflow: hidden; color: var(--hero-fg); border-radius: 32px; padding: 20px 20px 18px;
  background: linear-gradient(155deg, color-mix(in srgb, var(--c) 86%, #3b4f8a), color-mix(in srgb, var(--c) 52%, #0d1530));
  box-shadow: inset 0 1.5px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(0,0,0,.25), 0 0 0 .5px rgba(0,0,0,.35), 0 26px 46px -22px color-mix(in srgb, var(--c) 70%, #000); }
.hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 70% at 0% 0%, rgba(255,255,255,.34), transparent 55%), radial-gradient(80% 60% at 100% 100%, rgba(0,0,0,.28), transparent 70%); pointer-events: none; }
.hero::after { content: ""; position: absolute; right: -50px; top: -50px; width: 190px; height: 190px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,.4), transparent); opacity: .5; pointer-events: none; }
.hero > * { position: relative; z-index: 1; }
.hero .hk { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
.hero .pill { background: rgba(255,255,255,.26); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 0 0 .5px rgba(255,255,255,.3); font-weight: 700; padding: 3px 13px; border-radius: 999px; font-size: 13px; }
.hero .hd { opacity: .88; display: inline-flex; align-items: center; gap: 6px; }
.hero .hd .dot { background: #fff !important; }
.hero .ht { font-size: 30px; line-height: 1.2; font-weight: 800; margin: 14px 0 8px; letter-spacing: -.02em; }
.hero .hm { font-size: 15px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.hero .hm b { font-size: 24px; letter-spacing: -.02em; }
.hero .hm span { opacity: .78; font-size: 13.5px; }
.hero .prog { height: 6px; border-radius: 3px; background: rgba(255,255,255,.22); margin-top: 16px; overflow: hidden; }
.hero .prog i { display: block; height: 100%; background: #fff; border-radius: 3px; box-shadow: 0 0 12px rgba(255,255,255,.8); transition: width .6s var(--spring); }
.hero .hs { font-size: 12.5px; opacity: .8; margin-top: 6px; }
.hero .hw { margin-top: 10px; font-size: 13px; opacity: .8; }
.hero .acts { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.hero .btn { flex: 1; min-height: 48px; font-size: 16px; }
.hero .btn.lt { background: #fff; color: #0F1730; border-color: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; flex: 1.4; box-shadow: 0 10px 22px -10px rgba(0,0,0,.5); }
.hero .btn.ol { background: rgba(255,255,255,.18); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 0 0 .5px rgba(255,255,255,.3); }
.hero .btn.tx { background: none; border-color: transparent; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; color: #fff; opacity: .8; flex: 0 0 auto; }
.rituals { display: flex; gap: 8px; margin: 14px 0 0; flex-wrap: wrap; }
.sumday { padding: 16px 18px; }
.upnext { margin-top: 14px; padding: 4px 16px; border-radius: 24px; }
.upnext .it { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: .5px solid var(--rule); width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.upnext .it:last-child { border-bottom: 0; }
.upnext .tm { width: 46px; font-weight: 700; font-size: 14px; flex: none; }
.upnext .bar { width: 4px; align-self: stretch; border-radius: 2px; background: var(--c); flex: none; }
.upnext .tt { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.upnext .du { color: var(--ink3); font-size: 13px; flex: none; }

/* 时间轴 */
.tl { position: relative; margin-top: 8px; }
.tl-grid { position: relative; border-left: .5px solid var(--rule); margin-left: 46px; }
.tl .hr { position: absolute; left: -46px; width: 38px; text-align: right; font-size: 11.5px; color: var(--ink3); transform: translateY(-8px); }
.tl .hl { position: absolute; left: 0; right: 0; border-top: .5px solid var(--rule2); }
.blk { position: absolute; left: 8px; right: 0; border-radius: 14px; padding: 5px 10px 5px 14px; overflow: hidden; font-size: 13.5px; line-height: 1.3; text-align: left; border: .5px solid rgba(255,255,255,.55); display: block; box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 0 0 .5px var(--edge), 0 6px 14px -9px rgba(20,30,60,.4); transition: transform .25s var(--spring); }
.blk:active { transform: scale(.985); }
.blk::before { content: ""; position: absolute; left: 5px; top: 7px; bottom: 7px; width: var(--pw, 3px); border-radius: 2px; background: var(--c); }
.blk .t { font-weight: 650; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk .s { font-size: 12px; opacity: .78; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.blk.focus { color: #fff; background-image: linear-gradient(160deg, rgba(255,255,255,.28), transparent 55%); }
.blk.focus::before { background: rgba(255,255,255,.7); }
.blk.commit { background: rgba(var(--gl), var(--ga)) !important; -webkit-backdrop-filter: blur(var(--gb)); backdrop-filter: blur(var(--gb)); color: var(--ink); }
.blk.done { opacity: .5; } .blk.done .t { text-decoration: line-through; text-decoration-thickness: 1px; }
.blk.missed { background: repeating-linear-gradient(135deg, var(--rule2) 0 6px, transparent 6px 12px) !important; color: var(--ink2); border: .5px dashed var(--ink3); box-shadow: none; }
.blk.locked .t::after { content: " ⚓︎"; font-weight: 400; opacity: .7; }
.blk.now-on { box-shadow: 0 0 0 2px var(--now), 0 10px 22px -10px var(--now); }
.lunch { position: absolute; left: 8px; right: 0; border: .5px dashed var(--rule); border-radius: 14px; color: var(--ink3); font-size: 12px; display: grid; place-items: center; }
.lunch.away { background: repeating-linear-gradient(135deg, transparent 0 8px, var(--rule2) 8px 9px); }
.nowline { position: absolute; left: -46px; right: 0; border-top: 2px solid var(--now); z-index: 5; pointer-events: none; filter: drop-shadow(0 0 4px var(--now)); }
.nowline span { position: absolute; left: 0; top: -11px; background: var(--now); color: #fff; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; }
.deadlines { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.dlchip { border-radius: 999px; padding: 5px 6px 5px 14px; font-size: 13.5px; position: relative; display: inline-flex; align-items: center; gap: 6px; }
.dlchip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }

/* 回执卡 */
.rc { border-radius: 24px; padding: 14px 14px 12px; }
.rc + .rc { margin-top: 10px; }
.rc .ttl { font-weight: 750; font-size: 17px; }
.rc .line { color: var(--ink2); font-size: 13.5px; margin: 2px 0 8px; }
.rc.editing .chips .chip { box-shadow: 0 0 0 1px var(--ink3); }
.rc .btns { display: flex; gap: 8px; margin-top: 12px; }
.rc .btns .btn { flex: 1; padding: 7px 8px; min-height: 40px; font-size: 14.5px; }
.rc .editor { margin-top: 10px; padding: 10px; background: var(--fill); border-radius: 18px; }
.rc .ask { margin-top: 10px; padding-top: 10px; border-top: .5px dashed var(--rule); font-size: 14px; }
.rc.done { opacity: .55; }
.tag-note { font-size: 13px; color: var(--ink2); border-radius: 16px; padding: 9px 13px; margin-bottom: 10px; box-shadow: none; }

/* 底部输入条 */
#capture { position: fixed; z-index: 25; left: 14px; right: 14px; bottom: calc(var(--safe-b) + var(--nav-gap) + var(--nav-h) + 10px); max-width: 520px; margin: 0 auto; }
#capture .bar { display: flex; gap: 6px; align-items: center; border-radius: 30px; padding: 5px 5px 5px 18px; }
#capture input { border: 0; background: none; padding: 8px 0; min-height: 44px; flex: 1; outline: none; box-shadow: none; font-size: 16px; }
#capture .iconbtn { border: 0; background: none; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; width: 42px; height: 42px; color: var(--ink2); }
#capture .iconbtn.rec { color: #fff; background: var(--now); }
#capture .send { border: 0; background: var(--ink); color: var(--paper); height: 44px; padding: 0 20px; border-radius: 999px; font-weight: 700; box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }
body.nocap #capture { display: none; }

/* 周视图 */
.weekbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--ink2); margin: 2px 6px 10px; }
.legend i { display: inline-block; width: 14px; height: 10px; border-radius: 4px; vertical-align: -1px; margin-right: 4px; }
.wk { overflow-x: auto; overflow-y: hidden; border-radius: 24px; }
.wk-in { display: grid; grid-template-columns: 34px repeat(7, minmax(90px, 1fr)); min-width: 680px; position: relative; }
.wk-h { position: sticky; top: 0; z-index: 4; padding: 8px 4px 8px; text-align: center; font-size: 12.5px; border-bottom: .5px solid var(--rule); }
.wk-h.today b { color: var(--now); }
.wk-h .bar { height: 4px; border-radius: 2px; background: var(--rule); margin: 5px 8px 0; overflow: hidden; }
.wk-h .bar i { display: block; height: 100%; background: var(--ink3); }
.wk-h .bar.over i { background: #E0A020; }
.wk-gut { position: relative; border-right: .5px solid var(--rule2); }
.wk-gut span { position: absolute; right: 4px; font-size: 10.5px; color: var(--ink3); transform: translateY(-7px); }
.wk-col { position: relative; border-right: .5px solid var(--rule2); }
.wk-col.today { background: var(--nowtint); }
.wk-col.away { background: repeating-linear-gradient(135deg, transparent 0 8px, var(--rule2) 8px 9px); }
.wk-col .hl { position: absolute; left: 0; right: 0; border-top: .5px solid var(--rule2); }
.wk-col .blk { left: 3px; right: 3px; padding: 2px 5px 2px 11px; font-size: 11.5px; border-radius: 10px; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.wk-col .blk::before { left: 4px; top: 4px; bottom: 4px; }
.wk-col .blk .s { display: none; }
.blk.drag { z-index: 20; opacity: .92; box-shadow: 0 16px 30px -8px rgba(0,0,0,.5); touch-action: none; transform: scale(1.04); }
.dragmsg { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); top: calc(var(--safe-t) + 12px); background: rgba(20,26,40,.88); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); color: #fff; padding: 9px 16px; border-radius: 999px; font-size: 14px; max-width: 90vw; box-shadow: 0 10px 30px -8px rgba(0,0,0,.5); }
.dragmsg.bad { background: rgba(150,84,10,.92); }

/* 领域 */
.rings { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.ringc { text-align: center; padding: 14px 8px 12px; cursor: pointer; border-radius: 28px; }
.ringc svg { width: 112px; height: 112px; display: block; margin: 0 auto 4px; }
.ringc .nm { font-weight: 700; }
.ringc .st { font-size: 12.5px; color: var(--ink2); }
.ringc .gap { margin-top: 8px; }
.score { display: flex; align-items: center; gap: 18px; }
.score .big { font-size: 60px; font-weight: 800; line-height: 1; letter-spacing: -.04em; }
.bars { flex: 1; display: grid; gap: 7px; }
.bars div { display: grid; grid-template-columns: 74px 1fr; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink2); }
.bars i { display: block; height: 7px; border-radius: 4px; background: var(--rule); position: relative; overflow: hidden; }
.bars i b { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--now), color-mix(in srgb, var(--now) 60%, #6fe)); border-radius: 4px; }
.heat { display: grid; grid-template-columns: 30px repeat(7, 1fr); gap: 3px; font-size: 10.5px; color: var(--ink3); }
.heat div.c { height: 15px; border-radius: 5px; background: var(--rule2); }
.hab { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: .5px solid var(--rule); }
.hab:last-child { border-bottom: 0; }
.trend { display: flex; align-items: flex-end; gap: 10px; height: 96px; padding: 0 4px; }
.trend .c { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; font-size: 11.5px; color: var(--ink3); }
.trend .c i { display: block; width: 100%; max-width: 44px; border-radius: 10px 10px 4px 4px; background: linear-gradient(180deg, color-mix(in srgb, var(--now) 70%, #fff), var(--now)); min-height: 4px; }
.trend .c b { color: var(--ink); font-size: 12px; }

/* 回顾 */
.ins { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px 16px 12px; margin: 0 -16px; scrollbar-width: none; }
.ins::-webkit-scrollbar { display: none; }
.ic { scroll-snap-align: center; flex: 0 0 min(92%, 520px); min-height: 200px; display: flex; flex-direction: column; border-radius: 28px; }
.ic .k { font-size: 13px; color: var(--ink2); font-weight: 650; }
.ic .tx { font-size: 21px; font-weight: 750; line-height: 1.35; margin: 6px 0 8px; letter-spacing: -.01em; }
.ic .ef { color: var(--ink2); font-size: 14px; }
.ic .btn { margin-top: auto; align-self: flex-start; }
.ic .tail { margin-top: 14px; }
.dots { display: flex; gap: 6px; justify-content: center; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--rule); transition: all .3s var(--spring); }
.dots i.on { background: var(--ink); width: 18px; border-radius: 3px; }
.led { display: grid; grid-template-columns: 62px 1fr 54px; align-items: center; gap: 10px; padding: 5px 0; font-size: 13px; }
.led .stk { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--rule2); }
.askcard { display: flex; gap: 8px; align-items: center; padding: 0; border: 0; box-shadow: none; background: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
.askcard input { flex: 1; }
.suggest { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

/* 面板:悬浮玻璃 */
#sheet-root .scrim { position: fixed; inset: 0; z-index: 50; background: rgba(8,12,24,.32); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); display: flex; align-items: flex-end; justify-content: center; animation: fade .22s ease-out; }
#sheet-root .sheet { width: calc(100% - 16px); max-width: 560px; max-height: 90vh; overflow-y: auto; border-radius: 34px; margin-bottom: calc(8px + var(--safe-b)); padding: 8px 18px 20px; animation: up .42s var(--spring); overscroll-behavior: contain; --ga: .86; --gb: 40px; }
#sheet-root .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--rule); margin: 4px auto 14px; }
.sheet h3 { margin: 0 0 4px; font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
.sheet .lead { color: var(--ink2); font-size: 14.5px; margin-bottom: 12px; }
.sheet h2 { font-size: 17px; margin: 22px 4px 8px; }
.opt { display: block; width: 100%; text-align: left; border-radius: 22px; padding: 14px 16px; margin-top: 8px; -webkit-backdrop-filter: none; backdrop-filter: none; background: rgba(var(--gl), .5); transition: transform .25s var(--spring); }
.opt:active { transform: scale(.98); }
.opt b { display: block; font-size: 15.5px; } .opt span { color: var(--ink2); font-size: 13px; }
@keyframes up { from { transform: translateY(40px) scale(.96); opacity: 0 } to { transform: none; opacity: 1 } }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.spin { width: 34px; height: 34px; border: 3px solid var(--rule); border-top-color: var(--now); border-radius: 50%; margin: 0 auto; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: spin 2.4s linear infinite !important; } }

#toast { position: fixed; z-index: 70; left: 50%; transform: translate(-50%, 20px) scale(.96); bottom: calc(var(--nav-h) + var(--nav-gap) + var(--cap-h) + var(--safe-b) + 26px); border-radius: 22px; padding: 11px 18px; font-size: 14px; display: flex; gap: 14px; align-items: center; max-width: min(92vw, 500px); opacity: 0; pointer-events: none; transition: opacity .2s, transform .4s var(--spring); --ga: .8; }
body.nocap #toast { bottom: calc(var(--nav-h) + var(--nav-gap) + var(--safe-b) + 20px); }
#toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); pointer-events: auto; }
#toast button { border: 0; background: none; color: var(--now); font-weight: 750; padding: 0; }

/* 专注 */
#focus { position: fixed; inset: 0; z-index: 80; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; gap: 8px;
  background: radial-gradient(70% 50% at 20% 10%, rgba(90,120,255,.55), transparent 70%), radial-gradient(60% 50% at 90% 90%, rgba(60,200,180,.4), transparent 70%), #0A0F1E; }
#focus .t { font-size: 22px; font-weight: 700; max-width: 20em; }
#focus .clock { font-size: clamp(68px, 23vw, 140px); font-weight: 800; letter-spacing: -.05em; line-height: 1.05; font-variant-numeric: tabular-nums; }
#focus .sub { opacity: .7; font-size: 14px; }
#focus .btn { background: rgba(255,255,255,.14); color: #fff; min-width: 124px; --hi: rgba(255,255,255,.4); }
#focus .btn.fin { background: #fff; color: #0A0F1E; }

/* 桌面端:左侧悬浮玻璃栏 */
@media (min-width: 900px) {
  :root { --nav-h: 0px; --nav-gap: 0px; }
  #nav { top: 14px; bottom: 14px; left: 14px; right: auto; width: calc(var(--rail) - 14px); height: auto; margin: 0; max-width: none; flex-direction: column; justify-content: flex-start; padding: 18px 10px; border-radius: 30px; gap: 4px; }
  #nav .brand { display: block; font-size: 24px; font-weight: 800; padding: 4px 14px 18px; letter-spacing: .02em; }
  #nav .brand small { display: block; font-size: 11px; font-weight: 500; color: var(--ink3); letter-spacing: .14em; }
  #nav button { flex: none; flex-direction: row; justify-content: flex-start; gap: 12px; padding: 11px 14px; border-radius: 20px; font-size: 15px; }
  #main { margin-left: var(--rail); width: calc(100% - var(--rail)); max-width: none; padding: 28px 40px 130px; }
  body.nocap #main { padding-bottom: 60px; }
  #main > * { max-width: 880px; margin-left: auto; margin-right: auto; }
  #capture { left: calc(var(--rail) + 40px); right: 40px; bottom: 22px; max-width: 700px; }
  #toast { bottom: 100px; }
  body.nocap #toast { bottom: 32px; }
  .rings { grid-template-columns: repeat(3, 1fr); }
  #sheet-root .scrim { align-items: center; }
  #sheet-root .sheet { max-height: 86vh; margin-bottom: 0; }
  .wk-in { min-width: 0; }
  .hero .ht { font-size: 34px; }
  .bigday { font-size: 68px; }
}

/* 附件托盘 */
.tray { display: flex; gap: 8px; align-items: center; padding: 8px 10px; margin-bottom: 8px; border-radius: 26px; }
.tray .th { position: relative; width: 56px; height: 56px; border-radius: 16px; overflow: hidden; flex: none; box-shadow: 0 0 0 .5px var(--edge), 0 6px 14px -8px rgba(20,30,60,.5); }
.tray .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tray .th button { position: absolute; top: 2px; right: 2px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgba(10,14,24,.62); color: #fff; font-size: 15px; line-height: 20px; padding: 0; }
.tray .th.add { border: 1.5px dashed var(--ink3); background: none; color: var(--ink2); font-size: 26px; box-shadow: none; }
.tray .tt { font-size: 12.5px; color: var(--ink2); line-height: 1.4; min-width: 0; }

/* 面板切换与收起动画 */
#sheet-root .scrim.closing { animation: fadeout .24s ease-in forwards; pointer-events: none; }
#sheet-root .scrim.closing .sheet { animation: down .26s cubic-bezier(.4, 0, 1, 1) forwards; }
#sheet-root .sheet .sc.enter { animation: push .42s var(--spring); }
#sheet-root .grab { cursor: grab; touch-action: none; padding: 6px 0; background-clip: content-box; height: 17px; }
@keyframes fadeout { to { opacity: 0 } }
@keyframes down { to { transform: translateY(40px) scale(.97); opacity: 0 } }
@keyframes push { from { transform: translateX(34px); opacity: 0 } to { transform: none; opacity: 1 } }

/* 节假日标记 */
.hb { font-style: normal; font-size: 10.5px; font-weight: 750; line-height: 1; padding: 2px 5px; border-radius: 6px; margin-left: 3px; vertical-align: 1px; }
.hb.off { background: rgba(52,199,89,.2); color: #1E8A3C; }
.hb.work { background: rgba(255,149,0,.2); color: #B25E00; }
.sd .hb { margin: 2px 0 0; font-size: 9.5px; padding: 1px 4px; }
.sd.on .hb { background: rgba(255,255,255,.25); color: inherit; }
@media (prefers-color-scheme: dark) { .hb.off { color: #5FD97C; } .hb.work { color: #FFB84D; } }

/* ====== 动画:页面入场、数据图形生长、按压反馈 ====== */
html { scroll-behavior: smooth; }
#view.enter > * { animation: rise .55s var(--spring) both; }
#view.enter > *:nth-child(2) { animation-delay: .04s; } #view.enter > *:nth-child(3) { animation-delay: .08s; }
#view.enter > *:nth-child(4) { animation-delay: .12s; } #view.enter > *:nth-child(5) { animation-delay: .16s; }
#view.enter > *:nth-child(6) { animation-delay: .2s; }  #view.enter > *:nth-child(n+7) { animation-delay: .24s; }

@keyframes rise { from { opacity: 0; transform: translate(var(--dx, 0), 16px) scale(.985); } to { opacity: 1; transform: none; } }
#view.enter .ringc circle[stroke-linecap="round"], #top .donering circle[stroke-linecap="round"] { animation: draw 1s var(--spring) both; }
@keyframes draw { from { stroke-dasharray: 0 400; } }
#view.enter .bars i b, #view.enter .trend .c i { animation: grow .9s var(--spring) both; transform-origin: left; }
#view.enter .trend .c i { transform-origin: bottom; animation-name: growY; }
@keyframes grow { from { transform: scaleX(0); } } @keyframes growY { from { transform: scaleY(0); } }
.card, .ringc, .opt, .upnext .it, .hab, .chip, .sd, .banner { transition: transform .35s var(--spring), box-shadow .3s, background .25s; }
.ringc:active, .card[data-act]:active, .upnext .it:active { transform: scale(.975); }
.chip:active, .sd:active { transform: scale(.93); }
@media (hover: hover) { .btn:hover, .chip:hover { filter: brightness(1.05); } .ringc:hover { transform: translateY(-2px); } .upnext .it:hover { background: rgba(var(--gl), .4); } }
.hero { transition: transform .5s var(--spring); }
.hero .btn { transition: transform .25s var(--spring), filter .2s; }
#toast { transition: opacity .25s, transform .5s var(--spring); }
.blk { transition: transform .3s var(--spring), box-shadow .3s, opacity .3s; }
.tray .th { animation: pop .45s var(--spring); }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

#view.enter > * { will-change: transform, opacity; }
.sheet, #nav, #capture .bar { will-change: transform; }

/* 长期事项 */
.lt { border-radius: 26px; padding: 14px 14px 10px; margin-bottom: 14px; }
.lt-h { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.lt-h b { font-size: 16px; }
.lt-r { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-top: .5px solid var(--rule); }
.lt-r:first-of-type { border-top: 0; }
.lt-r .bar { width: 4px; align-self: stretch; border-radius: 2px; background: var(--c); opacity: .35; flex: none; }
.lt-r.due .bar { opacity: 1; }
.lt-t { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 2px 0; }
.lt-t .tt { display: block; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lt-t .su { display: block; font-size: 12.5px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lt-r:not(.due) .tt { font-weight: 500; color: var(--ink2); }

/* ===== 原生 App 手感(v1.5.3) ===== */
html { overscroll-behavior-y: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior-y: none; }
input, textarea, select, .selectable { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
button, [data-act], .blk, .chip, .opt, .sd, label, select { touch-action: manipulation; }
a, img { -webkit-user-drag: none; }
.blk { touch-action: pan-y; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.blk .rz { position: absolute; left: 0; right: 0; bottom: 0; height: 16px; touch-action: none; cursor: ns-resize; }
.blk .rz::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 26px; height: 3.5px; margin-left: -13px; border-radius: 2px; background: currentColor; opacity: .32; }
.wk-col .blk .rz { height: 14px; } .wk-col .blk .rz::after { width: 16px; margin-left: -8px; }
.blk.drag { z-index: 30; opacity: .94; box-shadow: 0 18px 34px -8px rgba(0,0,0,.5); transition: none !important; will-change: transform; }
html.dragging, html.dragging body { overflow-anchor: none; scroll-behavior: auto; }
html.dragging * { cursor: grabbing !important; }
.dragmsg { position: fixed; z-index: 90; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 10px); max-width: calc(100% - 24px); padding: 9px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 650; background: rgba(20,24,32,.88); color: #fff; box-shadow: 0 10px 30px -10px rgba(0,0,0,.5); pointer-events: none; text-align: center; }
.dragmsg.bad { background: rgba(176,58,46,.94); }
input[type=time], input[type=date], input[type=datetime-local] { min-height: 44px; border-radius: 14px; }
.timezone-button { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 600px) {
  #top { flex-wrap: wrap; }
  #top > .row { margin-left: auto; flex-shrink: 0; }
  .timezone-button { max-width: 120px; }
}

<body>
<div id="app">
  <nav id="nav" aria-label="主导航"></nav>
  <main id="main">
    <header id="top"></header>
    <div id="banners"></div>
    <div id="view"></div>
  </main>
  <div id="capture"></div>
</div>
<div id="sheet-root"></div>
<div id="focus" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* 启动自检:任何脚本加载失败或启动报错,都直接显示在页面上,方便定位 */
(function () {
  var errs = [];
  function show() {
    var d = document.getElementById('__boot');
    if (!d) { d = document.createElement('div'); d.id = '__boot'; d.setAttribute('style', 'position:fixed;inset:0;z-index:9999;background:#fff;color:#111;padding:20px;overflow:auto;font:14px/1.6 -apple-system,PingFang SC,sans-serif'); document.body.appendChild(d); }
    d.innerHTML = '<h2 style="margin:0 0 8px">时序没有正常启动</h2><div style="color:#555">下面是原因,请截图发给开发者。可以先点「清除缓存并重试」。</div>' +
      '<pre style="white-space:pre-wrap;background:#f4f4f6;padding:10px;border-radius:8px;margin:12px 0;font-size:12px">' + errs.map(function (e) { return String(e).replace(/</g, '&lt;'); }).join('\n') + '\n\n浏览器: ' + navigator.userAgent + '\n地址: ' + location.href + '</pre>' +
      '<button id="__fix" style="font:inherit;padding:10px 18px;border-radius:10px;border:0;background:#111;color:#fff">清除缓存并重试</button>';
    document.getElementById('__fix').onclick = function () {
      var jobs = [];
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
      if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
      Promise.all(jobs).then(function () { location.replace(location.pathname + '?r=' + Date.now()); }, function () { location.reload(); });
    };
  }
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t !== window && (t.src || t.href)) errs.push('文件加载失败: ' + (t.src || t.href));
    else errs.push('脚本错误: ' + e.message + ' (' + String(e.filename || '').split('/').pop() + ':' + e.lineno + ')');
    if (document.body) show();
  }, true);
  window.addEventListener('unhandledrejection', function (e) { errs.push('未处理的异常: ' + (e.reason && e.reason.message || e.reason)); if (document.body) show(); });
  window.addEventListener('load', function () {
    setTimeout(function () {
      var nav = document.getElementById('nav');
      if (!nav || !nav.innerHTML) { if (!errs.length) errs.push('页面脚本已加载,但界面没有渲染(没有报错信息)。'); show(); }
    }, 2500);
  });
})();
</script>
<script>
/* 时序 Chrono · 核心:常量、时间工具、数据层(本地优先) */
(function (G) {
  'use strict';
  const MIN = 60000, DAY = 86400000;

  const DOMAINS = {
    work:     { name: '工作', color: '#3E5C9A' },
    health:   { name: '健康', color: '#3F8F6B' },
    relation: { name: '关系', color: '#C2576F' },
    study:    { name: '学习', color: '#7B5EA7' },
    finance:  { name: '财务', color: '#B8862F' },

  };
  const DOMAIN_KEYS = Object.keys(DOMAINS);

  const DEFAULT_SETTINGS = () => ({
    timeZone: 'system',                       // 显示与新事项使用的时区

    if ((m = s.match(/(下|这|本)?(?:个)?(?:周|星期|礼拜)([一二三四五六日天])/))) {
      const base = weekStart(t0), w = WDI[m[2]];
      let ts = addDays(base, w + (m[1] === '下' ? 7 : 0));
      if (!m[1] && ts < t0) ts = addDays(ts, 7);
      return day(ts, m[0]);
    }
    if ((m = s.match(new RegExp('(' + NUM + ')月(' + NUM + ')[日号]?')))) {
      const mo = cn(m[1]) - 1, d = cn(m[2]), y = C.date(now).getFullYear();
      let dt = C.makeDate(y, mo, d); if (dayStart(dt.getTime()) < t0) dt = C.makeDate(y + 1, mo, d);
      return day(dt.getTime(), m[0]);
    }
    if ((m = s.match(/月底|月末/))) {
      const n = C.date(now); return day(C.makeDate(n.getFullYear(), n.getMonth() + 1, 0).getTime(), m[0], { soft: true });
    }
    if ((m = s.match(new RegExp('(' + NUM + ')[号日]')))) {
      const n = C.date(now), d = cn(m[1]); let dt = C.makeDate(n.getFullYear(), n.getMonth(), d);
      if (dayStart(dt.getTime()) < t0) dt = C.makeDate(n.getFullYear(), n.getMonth() + 1, d);
      return day(dt.getTime(), m[0]);
    }
    if ((m = s.match(/下(?:个)?周/))) {
      const mon = addDays(weekStart(t0), 7);
      return day(mon, m[0], { range: [mon, addDays(mon, 6)], soft: true });
    }
    if ((m = s.match(/这周|本周|这个星期/))) {
      return day(t0, m[0], { range: [t0, addDays(weekStart(t0), 6)], soft: true });
    }
    return null;
  }

  /* ---------- 钟点 ---------- */
  const PERIOD = /(早上|早晨|清晨|明早|今早|上午|中午|下午|傍晚|晚上|今晚|明晚|夜里)/;
  const TRE = new RegExp('(早上|早晨|清晨|上午|中午|下午|傍晚|晚上|夜里)?\\s*(' + NUM + ')\\s*(?:点钟|点|时|:|：)\\s*(半|一刻|(?:' + NUM + ')\\s*分?)?');
  function periodOf(s) {
    const m = s.match(PERIOD); if (!m) return null;
    const p = m[1];
    if (/早/.test(p) || p === '清晨') return 'am0';
    if (p === '上午') return 'am';
    if (p === '中午') return 'noon';
    if (p === '下午' || p === '傍晚') return 'pm';
    return 'eve';
  }
  const PWIN = { am0: [8 * 60, 10 * 60], am: [9 * 60, 12 * 60], noon: [12 * 60, 14 * 60], pm: [14 * 60, 18 * 60], eve: [19 * 60, 22 * 60] };
  function parseClock(s, period) {
    const m = s.match(TRE); if (!m) return null;
    const hRaw = m[2];
    if (hRaw === '一' && !m[1] && /点/.test(m[0])) return null;   // “一点水果”
    let h = cn(hRaw); if (isNaN(h) || h > 24) return null;
    let mi = 0;
    if (m[3]) mi = m[3] === '半' ? 30 : m[3] === '一刻' ? 15 : cn(m[3].replace(/分/, '').trim()) || 0;
    const p = m[1] ? periodOf(m[1]) : period;
    if (p === 'noon') { if (h < 11) h += 12; }
    else if (p === 'pm' || p === 'eve') { if (h < 12) h += 12; }
    else if (!p && h >= 1 && h <= 6) h += 12;
    return { min: h * 60 + mi, str: m[0] };
  }

  /* ---------- 时长 / 提前量 ---------- */
  function parseLead(s) {
    const m = s.match(new RegExp('提前\\s*(半个?小时|半个?钟头|(' + NUM + ')\\s*个?\\s*(小时|钟头|分钟|天))\\s*(?:提醒我?|做准备|准备)?'));
    if (!m) return null;
    let min = 30;
    if (!/^半/.test(m[1])) { const n = cn(m[2]); min = m[3] === '分钟' ? n : m[3] === '天' ? n * 1440 : n * 60; }
    return { min, str: m[0] };
  }
  function parseDur(s) {
    let m;
    if ((m = s.match(new RegExp('(' + NUM + ')\\s*个半(?:小时|钟头)')))) return { min: (cn(m[1]) + 0.5) * 60, str: m[0] };
    if ((m = s.match(new RegExp('(' + NUM + ')\\s*个?(?:小时|钟头)')))) return { min: cn(m[1]) * 60, str: m[0] };
    if ((m = s.match(/半个?(?:小时|钟头)/))) return { min: 30, str: m[0] };
    if ((m = s.match(new RegExp('(' + NUM + ')\\s*分钟')))) return { min: cn(m[1]), str: m[0] };
    if ((m = s.match(/一刻钟/))) return { min: 15, str: m[0] };
    return null;
  }

  /* ---------- 语义规则 ---------- */
  const DOMAIN_KW = [
    ['health', /医院|体检|跑步|健身|运动|游泳|瑜伽|复诊|吃药|疫苗|看病|牙|拉伸|散步|睡眠|门诊/],
    ['relation', /家长|爸|妈|父母|家人|生日|聚餐|约会|朋友|孩子|带娃|老婆|老公|女朋友|男朋友|同学|纪念日|送礼|礼物|探望|吃饭/],
    ['study', /学习|课|复习|读书|看书|论文|考试|背单词|刷题|练习|网课|备考|听讲座|讲座|英语/],
    ['finance', /还款|信用卡|报销|账单|缴费|交费|保险|理财|对账|发票|税|转账|房租|续费/],
    ['home', /打扫|洗衣|换床单|家务|滤芯|买菜|做饭|收拾|整理房间|快递|维修|垃圾|物业|拖地|买|超市|水果/],
    ['work', /会|方案|汇报|报告|客户|总|邮件|项目|周报|评审|PPT|需求|合同|复盘|面试|工作|开发|代码|上线|碰头|过方案/],
  ];
  const DEEP = /写|设计|方案|策划|论文|分析|决策|思考|代码|开发|研究|复盘|规划|报告|编程|备课/;
  const LOW = /报销|整理|填表|缴费|交费|还款|信用卡|快递|打扫|洗|买|订|转账|发票|对账|归档|打印|取|寄|拖地|倒垃圾|续费/;
  const MEET = /会|碰头|见面|见|约|面试|看诊|门诊|聚餐|吃饭|接|送|课|讲座|航班|飞|演出|电影|体检|疫苗|探望|聊|过方案|沟通|汇报/;
  const PAYDL = /还款|还信用卡|信用卡|缴费|交费|续费|账单|到期|截止|房租/;

  function domainOf(t) {
    let best = null, bs = 0;
    DOMAIN_KW.forEach(([k, re]) => { const n = (t.match(new RegExp(re.source, 'g')) || []).length; if (n > bs) { bs = n; best = k; } });
    return best || 'work';
  }
  function energyOf(t) { return LOW.test(t) ? 'low' : DEEP.test(t) ? 'deep' : 'mid'; }
  function ctxOf(t) {
    if (/电话|打给|致电|联系/.test(t)) return 'phone';
    if (/医院|体检|疫苗|超市|银行|买|取|寄|外出|去|接|送/.test(t)) return 'out';
    if (/打扫|洗衣|做饭|家务|换床单|拖地/.test(t)) return 'home';
    if (/写|代码|邮件|方案|报告|报销|PPT|论文|设计|填表|在线/.test(t)) return 'pc';
    return '';
  }
  const PRIORS = [
    [/打电话|电话/, 15], [/邮件|回复/, 20], [/报销|整理|填表|发票/, 30], [/体检/, 120], [/疫苗/, 120],
    [/看病|门诊|复诊/, 120], [/聚餐|吃饭/, 120], [/健身|运动|跑步|游泳|瑜伽/, 60], [/周报/, 60],
    [/方案|报告|论文|设计/, 180], [/会|碰头|沟通|聊|汇报|评审/, 60], [/复习/, 45], [/读书|看书|学习/, 45],
    [/打扫|洗衣|换床单/, 45], [/买菜/, 45],
  ];
  function priorMin(t, energy) {
    for (const [re, m] of PRIORS) if (re.test(t)) return m;
    return energy === 'deep' ? 90 : energy === 'low' ? 30 : 45;
  }
  const keyOf = (domain, energy) => domain + '/' + energy;

  /* 估时:历史数据优先,其次通用先验;用户自己说的时长按个人偏差修正 */
  function estimate(st, domain, energy, stated, isEvent, title) {
    if (isEvent && stated) return { min: stated, conf: 0.95, src: 'stated' };
    if (stated) {
      const r = st.stats.ratio[domain];
      let mult = (st.settings.estMult || {})[domain] || 1;
      if (r && r.n >= 3) mult = Math.max(mult, Math.min(2.5, Math.max(0.8, r.sum / r.n)));
      if (mult > 1.08 && !isEvent) return { min: Math.ceil(stated * mult / 5) * 5, conf: 0.8, src: 'learned', stated };
      return { min: stated, conf: 0.9, src: 'stated' };
    }
    const d = st.stats.dur[keyOf(domain, energy)];
    if (d && d.n >= 2) return { min: Math.round(d.sum / d.n / 5) * 5, conf: 0.7, src: 'history' };
    return { min: priorMin(title, energy), conf: 0.4, src: 'prior' };
  }

  function cleanTitle(s) {
    s = s.replace(/[，,。；;！!？?、\s]+/g, ' ').trim();
    for (let i = 0; i < 4; i++) {
      s = s.replace(/^(还有|另外|然后|再就是|最后|以及|并且|而且|记得|别忘了|务必|一定要|一定|必须|麻烦|帮我|我要|我得|需要|尽快|紧急|马上|立刻|要|得|把|将|在|于|就|再|也|先|的|和我|给我)\s*/, '');
      s = s.replace(/^[的在于要得]+(?=\S)/, '');
    }
    return s.replace(/(一下|吧|啊|呀)$/, '').trim();
  }

  /* ---------- 习惯 / 周期 ---------- */
  function parseHabit(seg, st, now) {
    let m, days = null, perWeek = 0;
    let text = seg; let monthDay = 0, every = 0, text2 = null;
    if ((m = text.match(new RegExp('每隔?\\s*(' + NUM + ')\\s*天'))) && cn(m[1]) >= 2) every = cn(m[1]);
    else if ((m = text.match(new RegExp('每个?月(?:的)?\\s*(' + NUM + ')\\s*[号日]'))) && cn(m[1]) >= 1 && cn(m[1]) <= 31) monthDay = cn(m[1]);
    else if (/每个?月(?:底|末)/.test(text)) monthDay = 31;
    if (every || monthDay) days = [];
    else if (/每(?:个)?工作日|工作日每天/.test(text)) days = [0, 1, 2, 3, 4];
    else if (/每[天日]/.test(text)) days = [0, 1, 2, 3, 4, 5, 6];
    else if ((m = text.match(new RegExp('每周\\s*(' + NUM + ')\\s*次')))) perWeek = cn(m[1]);
    else if ((m = text.match(/每周(?:的)?([一二三四五六日天](?:[、,和及]?[一二三四五六日天])*)/))) {
      days = [...m[1].replace(/[、,和及]/g, '')].map((c) => WDI[c]);
    } else if (/每(?:一)?(?:个)?(?:周|星期|礼拜)|(?:一|每)周(?:都)?要|每周都/.test(text)) { perWeek = 1; const mm = text.match(new RegExp('(' + NUM + ')\\s*次')); if (mm && cn(mm[1]) >= 1 && cn(mm[1]) <= 7) { perWeek = cn(mm[1]); text2 = text.replace(mm[0], ' '); } }     // 「每周都要写周报」:不限星期,由系统逐周自动安排
    else return null;
    if (every || monthDay) days = null;
    if (text2) text = text2;
    const per = periodOf(text), clk = parseClock(text.replace(/每周[一二三四五六日天、,和及]+/g, ''), per);
    const dur = parseDur(text);
    let t = text;
    [new RegExp('每隔?\\s*(?:' + NUM + ')\\s*天'), new RegExp('每个?月(?:的)?\\s*(?:' + NUM + ')\\s*[号日]'), /每个?月(?:底|末)/, /每(?:个)?工作日|工作日每天/, /每[天日]/, new RegExp('每周\\s*(?:' + NUM + ')\\s*次'), /每周(?:的)?[一二三四五六日天](?:[、,和及]?[一二三四五六日天])*/, /每(?:一)?(?:个)?(?:周|星期|礼拜)(?:都)?(?:要|得|需要)?/, PERIOD]
      .forEach((re) => { t = t.replace(re, ' '); });
    if (clk) t = t.replace(clk.str, ' ');
    if (dur) t = t.replace(dur.str, ' ');
    const title = cleanTitle(t) || '例行事项';
    const domain = domainOf(title), energy = energyOf(title);
    const meet = /会$|例会|周会|晨会/.test(title);
    const pref = per === 'am0' || per === 'am' ? 'morning' : per === 'noon' ? 'noon' : per === 'eve' || per === 'pm' ? 'evening' : 'any';
    return {
      id: null, title, domain, energy, days, perWeek, time: clk ? clk.min : null, dur: dur ? dur.min : (meet ? 60 : priorMin(title, energy) > 60 ? 60 : priorMin(title, energy)),
      pref, kind: meet && clk ? 'commit' : 'habit', skipLeft: 1, raw: seg, monthDay, every,
    };
  }

  /* ---------- 主入口 ---------- */
  /* 自定义时长:「50」(按分钟)「90分钟」「1.5小时」「1小时20分」「1:30」「一个半小时」「2h」 */
  C.parseDurText = (s) => {
    s = String(s == null ? '' : s).trim().toLowerCase().replace(/：/g, ':').replace(/\s+/g, '');
    if (!s) return null;
    let m, total = 0;
    if ((m = s.match(/^(\d+):(\d{1,2})$/))) total = +m[1] * 60 + +m[2];
    else if (/^\d+(\.\d+)?$/.test(s)) total = +s;
    else {
      const H = s.match(new RegExp('(' + NUM + ')(个半)?(?:个)?(?:小时|钟头|hrs|hr|h)')), Mi = s.match(new RegExp('(' + NUM + ')(?:分钟|分|min|m)(?![a-z])'));
      if (/^半(?:个)?(?:小时|钟头)$/.test(s)) total = 30;
      else if (!H && !Mi) return null;
      else { if (H) total += cn(H[1]) * 60 + (H[2] ? 30 : 0); if (Mi) total += cn(Mi[1]); if (isNaN(total)) return null; }
    }
    total = Math.round(total);
    return total >= 1 && total <= 1440 ? total : null;
  };

  C.habitLabel = (h) => (h.monthDay ? (h.monthDay >= 31 ? '每月底' : '每月 ' + h.monthDay + ' 号') : h.every ? '每 ' + h.every + ' 天' : h.days ? (h.days.length === 7 ? '每天' : h.days.length === 5 && h.days[4] === 4 ? '工作日' : '每周' + h.days.map((d) => C.WD[d].slice(1)).join('、')) : '每周 ' + h.perWeek + ' 次') + (h.time != null ? ' ' + C.fmtM(h.time) : '');

  /* 休假 / 出差 / 请假:「下周三到周五出差」「明天请假」 */
  function parseAway(seg, now) {
    let m = seg.match(/^(.*?)(?:从)?([^到至]+?)(?:到|至)([^出请休旅放培]+?)(?:去|的)?(出差|请假|休假|旅游|旅行|出游|放假|培训)/);
    if (m) {
      const a = parseDate(m[2], now), b = parseDate(m[3], now);
      if (a && b) { let to = b.ts; if (to < a.ts) to = addDays(to, 7); return { from: a.ts, to, label: m[4] }; }
    }
    m = seg.match(/^(.*?)(今天|明天|后天|周[一二三四五六日天]|下周[一二三四五六日天]|\d+月\d+[日号])(?:一天|全天)?(请假|休假|出差|放假)/);
    if (m) { const a = parseDate(m[2], now); if (a) return { from: a.ts, to: a.ts, label: m[3] }; }
    return null;
  }

  function parse(text, st, now) {
    now = now || Date.now();
    const segs = String(text).split(/[，,。；;！!\n]+/).map((x) => x.trim()).filter(Boolean);
    const drafts = [], habits = [], aways = []; let lastKind = '';
    segs.forEach((seg0) => {
      let seg = seg0.replace(/^(还有|另外|然后|再就是|最后|以及)/, '').replace(/^每次\s*/, '');
      const aw = parseAway(seg, now);
      if (aw) { aways.push(aw); return; }
      const h = parseHabit(seg, st, now);
      if (h) { habits.push(h); lastKind = 'habit'; return; }

      const period = periodOf(seg);
      const asap = /尽快|越快越好|马上|立刻/.test(seg);
      let urgent = /紧急|务必|必须|一定要|一定|重要|关键/.test(seg);
      const low = /有空|有时间再|不急|随便|以后再说/.test(seg);
      const lead = parseLead(seg); if (lead) seg = seg.replace(lead.str, ' ');
      const wantPrep = !!(lead && /准备/.test(lead.str));
      const travelM = seg.match(new RegExp('(?:路上|车程|通勤|路程)\\s*(' + NUM + ')\\s*(分钟|小时|个小时)'));
      let travel = 0; if (travelM) { const n = cn(travelM[1]); travel = travelM[2] === '分钟' ? n : n * 60; seg = seg.replace(travelM[0], ' '); }
      const afterM = seg.match(/(?:等|待|做完|完成)(.{1,12}?)(?:之后|以后|后)再/); // 「等方案做完之后再…」→ 依赖线索,交给编辑面板确认
      void afterM;
      const dur = parseDur(seg); if (dur) seg = seg.replace(dur.str, ' ');
      let date = parseDate(seg, now); if (date) seg = seg.replace(date.str, ' ');
      const before = /(之前|以前|以内|之内|前)/.test(seg) && !!date;
      if (before) seg = seg.replace(/(之前|以前|以内|之内|前)/, ' ');
      const clk = parseClock(seg, period); if (clk) seg = seg.replace(clk.str, ' ');
      if (period) seg = seg.replace(PERIOD, ' ');
      seg = seg.replace(/下个月|这个月|本月/, ' ');
      const title = cleanTitle(seg);

      // 纯修饰片段(只有时长/提前量等)并入上一条
      const prev = drafts[drafts.length - 1];
      if (lastKind === 'habit' && title.length < 2 && dur) { habits[habits.length - 1].dur = dur.min; return; }
      if (prev && /^(很|比较)?(紧急|重要|务必|不急|有空再说|尽快)$/.test(title)) {
        prev.priority = /不急|有空/.test(title) ? 3 : 1; return;
      }
      if ((title.length < 2 || /^提前/.test(seg0)) && prev) {
        if (dur && !prev.statedMin) {
          const est = estimate(st, prev.domain, prev.energy, dur.min, prev.type === 'event', prev.title);
          prev.statedMin = dur.min; prev.estMin = est.min; prev.conf = est.conf; prev.src = est.src; prev.learnedFrom = est.stated || 0;
          if (prev.type === 'event') prev.end = prev.start + prev.estMin * MIN;
          if (prev.type === 'task') { prev.splittable = prev.energy === 'deep' || prev.estMin >= 120; prev.askDue = false; if (!prev.due && !prev.asap) prev.askDue = prev.estMin >= 60; }
        }
        if (lead) prev.lead = lead.min;
        if (prev.type === 'event') { if (wantPrep) prev.prep = Math.min(120, lead.min); if (travel) prev.travel = travel; }
        if (date && !prev.date) { prev.date = date; }
        if (clk && prev.type === 'event' && !prev.hasClock) { prev.hasClock = true; prev.start = C.atMinute(prev.start, clk.min); prev.end = prev.start + prev.estMin * MIN; }
        return;
      }
      if (title.length < 1) return;

      const domain = domainOf(title), energy = energyOf(title);
      const d = {
        id: null, raw: seg0, title, short: title.length > 12 ? title.slice(0, 12) : title,
        domain, energy, ctx: ctxOf(title), priority: urgent ? 1 : low ? 3 : 2,
        status: 'planned', flex: 'move', lead: lead ? lead.min : 0, date,
        postponed: 0, actual: 0, createdAt: now, source: 'text',
      };
      if (/看展|逛街|有空/.test(title)) d.flex = 'drop';

      // 类型判定
      const isDeadline = PAYDL.test(title) && !before && !dur && !clk;
      if (isDeadline) {
        d.type = 'deadline'; d.estMin = 0; d.conf = 0.9; d.src = 'stated';
        d.due = date ? C.dayEnd(date.ts) : addDays(dayStart(now), 7) - 1;
        if (!d.lead) d.lead = domain === 'finance' ? 2 * 1440 : 1440;
        d.status = 'planned';
      } else if (clk && !before) {
        d.type = 'event'; d.flex = 'fixed'; d.hasClock = true;
        const est = estimate(st, domain, energy, dur ? dur.min : 0, true, title);
        d.statedMin = dur ? dur.min : 0; d.estMin = est.min || (/聚餐|吃饭|疫苗|体检|看病/.test(title) ? 120 : 60); d.conf = est.conf; d.src = est.src;
        const base = date ? date.ts : (clk.min <= (now - dayStart(now)) / MIN ? addDays(dayStart(now), 1) : dayStart(now));
        d.start = C.atMinute(base, clk.min); d.end = d.start + d.estMin * MIN;
        d.date = d.date || { ts: base };
        if (wantPrep) d.prep = Math.min(120, lead.min);
        if (travel) d.travel = travel;
      } else {

      '<button class="opt" data-act="iv" data-k="drop" data-id="' + itemId + '"><b>直接删掉</b><span>它可能本来就不重要</span></button>');
  };
  A.skipBlock = (id) => {
    A.closeSheet();
    A.mutate(() => C.skipToday(A.st, id, now()), '好,今天不做了。已为它找明天以后的位置。');
  };
  A.completeBlock = (id, actual) => {
    A.closeSheet();
    const r = A.mutate(() => C.markDone(A.st, id, actual, now()));
    if (!r) return;
    if (r.finished && r.item && r.item.type === 'task' && r.item.statedMin) {
      const ratio = r.item.actual / r.item.statedMin;
      A.toast('完成。实际 ' + C.fmtDur(r.item.actual) + (ratio > 1.15 ? ',比你说的长 ' + Math.round((ratio - 1) * 100) + '%,估时模型已记下' : ratio < 0.85 ? ',比预估短,已记下' : ',和预估基本一致'), { undo: A._lastSnap });
    } else A.toast('已完成');
  };

  /* 专注计时 */
  A.canWake = () => !!(navigator.wakeLock);
  A.openFocus = (id) => {
    const b = A.st.blocks.find((x) => x.id === id); if (!b) return;
    A.focus = { id, t0: b.startedAt || now() };
    const el = $('#focus'); el.hidden = false;
    document.body.style.overflow = 'hidden';
    try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then((w) => (A._wake = w)).catch(() => {}); } catch (e) { /* */ }
    const tick = () => {
      if (!A.focus) return;
      const bb = A.st.blocks.find((x) => x.id === A.focus.id); if (!bb) return A.closeFocus();
      const planned = C.bmin(bb) * 60, el2 = Math.round((now() - A.focus.t0) / 1000), left = planned - el2, ab = Math.abs(left);
      const f = (n) => (n < 10 ? '0' : '') + n, h = Math.floor(ab / 3600), m = Math.floor((ab % 3600) / 60), s2 = ab % 60;
      $('#focus').innerHTML = '<div class="sub">专注中 · 通知静音</div><div class="t">' + esc(bb.title) + '</div><div class="clock">' + (left < 0 ? '+' : '') + (h ? h + ':' + f(m) : f(m)) + ':' + f(s2) + '</div>' +
        '<div class="sub">' + (left < 0 ? '已超出计划 ' + C.fmtDur(Math.ceil(ab / 60)) : '计划 ' + C.fmtDur(planned / 60)) + '</div>' +
        '<div class="row" style="margin-top:26px;gap:12px"><button class="btn" data-act="focus-close">先停一下</button><button class="btn fin" data-act="focus-done">完成</button></div>';
    };
    tick(); clearInterval(A._ft); A._ft = setInterval(tick, 1000);
  };
  A.closeFocus = () => {
    clearInterval(A._ft); A.focus = null; $('#focus').hidden = true; document.body.style.overflow = '';
    try { A._wake && A._wake.release(); } catch (e) { /* */ } A._wake = null; A.render();
  };
  A.finishFocus = () => {
    const f = A.focus; if (!f) return;
    const b = A.st.blocks.find((x) => x.id === f.id); const planned = C.bmin(b), el = Math.max(1, Math.round((now() - f.t0) / MIN));
    const fin = (actual) => { A.closeFocus(); A.completeBlock(f.id, actual); };
    if (el > planned * 1.2 && planned >= 15) {
      A.closeFocus(); A.focus = null;
      A.sheet('<h3>多花了 ' + C.fmtDur(el - planned) + '</h3><div class="lead">是估少了,还是被打断了?一个问题,两个选项。</div>' +
        '<button class="opt" data-act="over" data-id="' + f.id + '" data-v="' + el + '"><b>估少了</b><span>计入你的估时模型,以后同类事项会自动放宽</span></button>' +
        '<button class="opt" data-act="over" data-id="' + f.id + '" data-v="' + planned + '"><b>被打断了</b><span>按计划时长记录,不影响估时模型</span></button>');
    } else fin(el < 5 && planned >= 15 ? planned : el);
  };

  /* ================= 捕获与回执卡 ================= */
  A.canVoice = () => !!(G.SpeechRecognition || G.webkitSpeechRecognition);
  A.toggleMic = () => {
    const SR = G.SpeechRecognition || G.webkitSpeechRecognition; if (!SR) return;
    const btn = $('#micBtn');
    if (A._rec) { A._rec.stop(); return; }
    const r = (A._rec = new SR()); r.lang = 'zh-CN'; r.interimResults = true; r.continuous = false;
    btn.classList.add('rec');
    r.onresult = (e) => { let t = ''; for (const x of e.results) t += x[0].transcript; $('#capIn').value = t; A._capText = t; };
    r.onend = () => { A._rec = null; const b = $('#micBtn'); b && b.classList.remove('rec'); const v = $('#capIn').value.trim(); if (v) A.capture(v); };
    r.onerror = () => { A.toast('语音没听清,可以直接打字。'); };
    r.start();
  };

  A.capture = (text, source) => {
    text = (text || '').trim(); if (!text) return;
    const r = C.parse(text, A.st, now());
    if (!r.items.length && !r.habits.length && !r.aways.length) { A.toast('没读出事项。试试:「周五下午三点和张总过方案,一小时」'); return; }
    r.items.forEach((d) => { d.source = source || 'text'; });
    A.rc = { text, cards: r.items.map((d) => ({ kind: 'item', d, state: 'pending', edit: false, field: null, edits: 0 })).concat(r.habits.map((h) => ({ kind: 'habit', h, state: 'pending', edits: 0 }))).concat(r.aways.map((a) => ({ kind: 'away', a, state: 'pending', edits: 0 }))) };
    A._capText = ''; const inp = $('#capIn'); if (inp) inp.value = '';
    A.drawReceipt();
  };

  const DURS = [[15, '15 分'], [30, '30 分'], [45, '45 分'], [60, '1 小时'], [90, '1.5 小时'], [120, '2 小时'], [180, '3 小时'], [240, '4 小时']];
  const dayChips = (cur) => [['0', '今天'], ['1', '明天'], ['2', '后天'], ['we', '周末'], ['wk', '本周内'], ['nx', '下周内'], ['no', '没有截止']].map(([k, n]) => '<button class="chip" data-act="rc-set" data-f="day" data-v="' + k + '">' + n + '</button>').join('');
  function cardHtml(c, i) {
    const t = now();
    if (c.kind === 'away') {
      const a = c.a, same = a.from === a.to;
      return '<div class="rc ' + (c.state !== 'pending' ? 'done' : '') + '"><div class="ttl">' + esc(a.label) + '</div><div class="line">' + C.dayLabel(a.from, t) + (same ? '' : ' 到 ' + C.dayLabel(a.to, t)) + ' ｜ 这些天不排任务</div>' +
        '<div class="chips"><span class="chip">不可用日</span></div>' + (c.state === 'pending' ? '<div class="btns"><button class="btn pri" data-act="rc-ok" data-i="' + i + '">就这样</button><button class="btn" data-act="rc-park" data-i="' + i + '">不用了</button></div>' : '<div class="small muted" style="margin-top:8px">' + (c.state === 'ok' ? '✓ 已标记' : '已跳过') + '</div>') + '</div>';
    }
    if (c.kind === 'habit') {
      const h = c.h, dn = C.habitLabel(h).replace(/ \d\d:\d\d$/, '');
      return '<div class="rc ' + (c.state !== 'pending' ? 'done' : '') + '"><div class="ttl">' + esc(h.title) + '</div><div class="line">周期 · ' + dn + (h.time != null ? ' ' + C.fmtM(h.time) : '') + ' · ' + C.fmtDur(h.dur) + ' · 自动占位</div>' +
        '<div class="chips"><span class="chip"><i class="dot" style="background:' + DOMAINS[h.domain].color + '"></i>' + DOMAINS[h.domain].name + '</span><span class="chip">' + (h.kind === 'commit' ? '承诺块' : '习惯块') + '</span></div>' +
        (c.state === 'pending' ? '<div class="btns"><button class="btn pri" data-act="rc-ok" data-i="' + i + '">就这样</button><button class="btn" data-act="rc-park" data-i="' + i + '">先放着</button></div>' : '<div class="small muted" style="margin-top:8px">' + (c.state === 'ok' ? '✓ 已加入周期' : '已跳过') + '</div>') + '</div>';
    }
    const d = c.d, L = C.receiptLine(d, t), dom = DOMAINS[d.domain];
    const chip = (f, label, extra) => '<button class="chip" data-act="rc-field" data-i="' + i + '" data-f="' + f + '"' + (c.field === f ? ' aria-pressed="true"' : '') + '>' + label + (c.edit ? ' ✎' : '') + (extra || '') + '</button>';
    const learned = d.src === 'learned' ? '<div class="small muted" style="margin-top:6px">按你过去的速度,「' + C.fmtDur(d.learnedFrom) + '」估为 ' + C.fmtDur(d.estMin) + '</div>' : d.src === 'history' ? '<div class="small muted" style="margin-top:6px">按你做过的同类事项估时</div>' : '';
    let ed = '';
    if (c.field === 'dur') ed = '<div class="chips">' + DURS.map(([m, n]) => '<button class="chip" data-act="rc-set" data-i="' + i + '" data-f="dur" data-v="' + m + '">' + n + '</button>').join('') + '</div><div class="row" style="margin-top:8px;gap:8px"><input type="text" id="rcDur' + i + '" placeholder="自定义:50 分钟 / 1.5 小时 / 1:20" autocomplete="off"><button class="btn sm pri" data-act="rc-dur" data-i="' + i + '">好</button></div>';
    if (c.field === 'when') ed = d.type === 'event'
      ? '<div class="row" style="gap:8px"><input type="date" id="rcDate' + i + '" value="' + dateVal(d.start) + '"><input type="time" id="rcTime' + i + '" value="' + timeVal(d.start) + '"><button class="btn sm pri" data-act="rc-when" data-i="' + i + '">好</button></div>'
      : '<div class="chips">' + dayChips() .replace(/data-act="rc-set"/g, 'data-act="rc-set" data-i="' + i + '"') + '</div><div class="row" style="margin-top:8px;gap:8px"><input type="date" id="rcDate' + i + '" value="' + (d.due ? dateVal(d.due) : '') + '"><button class="btn sm pri" data-act="rc-due" data-i="' + i + '">按这天截止</button></div>';
    if (c.field === 'dom') ed = '<div class="chips">' + DOMAIN_KEYS.map((k) => '<button class="chip" data-act="rc-set" data-i="' + i + '" data-f="dom" data-v="' + k + '"><i class="dot" style="background:' + DOMAINS[k].color + '"></i>' + DOMAINS[k].name + '</button>').join('') + '</div>';
    if (c.field === 'pri') ed = '<div class="chips">' + [[0, 'P0 今天必须'], [1, 'P1 重要'], [2, 'P2 一般'], [3, 'P3 有空再说']].map(([p, n]) => '<button class="chip" data-act="rc-set" data-i="' + i + '" data-f="pri" data-v="' + p + '">' + n + '</button>').join('') + '</div>';
    const ask = c.state === 'pending' && d.askDue && d.type === 'task' && !d.due
      ? '<div class="ask">这个必须今天做完,还是这周都行?<div class="chips" style="margin-top:8px"><button class="chip" data-act="rc-set" data-i="' + i + '" data-f="day" data-v="0">今天</button><button class="chip" data-act="rc-set" data-i="' + i + '" data-f="day" data-v="wk">这周都行</button><button class="chip" data-act="rc-set" data-i="' + i + '" data-f="day" data-v="no">不急</button></div></div>' : '';
    return '<div class="rc ' + (c.state !== 'pending' ? 'done' : '') + (c.edit ? ' editing' : '') + '"><div class="ttl">' + esc(d.short) + (d.status === 'inbox' ? ' <span class="chip">待澄清</span>' : '') + '</div>' +
      '<div class="line">' + L.parts.join(' ｜ ') + (L.lead ? ' ｜ 会提前 ' + (L.lead >= 1440 ? Math.round(L.lead / 1440) + ' 天' : L.lead + ' 分钟') + '提醒你' : '') + '</div>' +
      '<div class="chips">' + chip('when', d.type === 'event' ? C.dayLabel(d.start, t) + ' ' + hmm(d.start) : d.type === 'deadline' ? C.dayLabel(d.due, t) : d.due ? C.dayLabel(d.due, t) + '前' : '本周内') +
      (d.type === 'deadline' ? '' : chip('dur', C.fmtDur(d.estMin))) + chip('dom', '<i class="dot" style="background:' + dom.color + '"></i>' + dom.name) + chip('pri', 'P' + d.priority) + '</div>' + learned +
      (ed ? '<div class="editor">' + ed + '</div>' : '') + ask +
      (c.state === 'pending' ? '<div class="btns"><button class="btn pri" data-act="rc-ok" data-i="' + i + '">就这样</button><button class="btn" data-act="rc-edit" data-i="' + i + '">改一下</button><button class="btn" data-act="rc-park" data-i="' + i + '">先放着</button></div>'
        : '<div class="small muted" style="margin-top:8px">' + (c.state === 'ok' ? '✓ 已确认' : '已放进收件箱') + '</div>') + '</div>';
  }
  const p2 = C.p2;
  const dateVal = (ts) => { const d = C.date(ts); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); };
  const timeVal = (ts) => { const d = C.date(ts); return p2(d.getHours()) + ':' + p2(d.getMinutes()); };
  const parseDateVal = (v) => C.parseDateTime(v);
  A.dateVal = dateVal; A.timeVal = timeVal; A.parseDateVal = parseDateVal;

  A.drawReceipt = () => {
    const rc = A.rc; if (!rc) return;
    const pend = rc.cards.filter((c) => c.state === 'pending').length;
    A.sheet('<h3>读到 ' + rc.cards.length + ' 项</h3><div class="lead">只需确认或修正。点任一标签,只改那一项。</div>' + (rc.note ? '<div class="tag-note">' + esc(rc.note) + '</div>' : '') +
      (pend > 1 ? '<button class="btn pri" style="width:100%;margin-bottom:10px" data-act="rc-all">全部就这样</button>' : '') +
      rc.cards.map(cardHtml).join(''), () => A.finishReceipt(true));
  };

  A.setCard = (i, f, v) => {
    const c = A.rc.cards[i], d = c.d; if (!d) return; const t = now(), t0 = C.dayStart(t);
    if (f === 'dur') {
      v = +v; d.statedMin = v; d.estMin = v; d.conf = 0.9; d.src = 'stated'; d.learnedFrom = 0; d.splittable = d.type === 'task' && (d.energy === 'deep' || v >= 120);
      if (d.type === 'event') d.end = d.start + v * MIN;
    } else if (f === 'dom') { d.domain = v; d.energy = C.energyOf(d.short); }
    else if (f === 'pri') d.priority = +v;
    else if (f === 'day') {
      d.askDue = false; delete d.notBefore;
      const ws = C.weekStart(t0);
      if (v === 'no') { delete d.due; delete d.asap; }
      else if (v === 'wk') { d.due = C.addDays(ws, 7) - 1; }
      else if (v === 'nx') { d.notBefore = C.addDays(ws, 7); d.due = C.addDays(ws, 14) - 1; }
      else if (v === 'we') { d.notBefore = C.addDays(ws, 5); d.due = C.addDays(ws, 7) - 1; }
      else { d.due = C.dayEnd(C.addDays(t0, +v)); if (v === '0') d.notBefore = t0; }
    }
    c.edits++; c.field = null;
  };

  A.finishReceipt = (viaClose) => {
    const rc = A.rc; if (!rc) return; A.rc = null;
    const parked = rc.cards.filter((c) => c.state === 'pending').length;
    const ok = rc.cards.filter((c) => c.state === 'ok' || c.state === 'parked' || c.state === 'pending');
    if (!ok.length) return;
    let res = null, added = [], habitN = 0, awayN = 0, aw = null;
    A.mutate(() => {
      const st = A.st, items = [];
      st.stats.edits = st.stats.edits || { n: 0, total: 0 };
      ok.forEach((c) => {
        st.stats.edits.total++; if (c.edits) st.stats.edits.n++;
        if (c.kind === 'away') { if (c.state === 'ok') { aw = C.addAway(st, c.a.from, c.a.to, c.a.label, now()); awayN++; } return; }
        if (c.kind === 'habit') { if (c.state === 'ok') { C.addHabit(st, c.h, now()); habitN++; } return; }
        if (c.state !== 'ok') c.d.status = 'inbox';
        if (c.d.status === 'inbox' && c.d.type === 'event') { c.d.status = 'inbox'; }
        items.push(c.d);
      });
      added = C.addItems(st, items, now());
      // 事件被放进收件箱时不占位:addItems 只对非 inbox 事件建块
      res = C.plan(st, now(), 'inc');
      A.lastPlan = res;
    });
    const placedN = added.filter((i) => i.status !== 'inbox').length, inboxN = added.length - placedN;
    let msg = [];
    if (placedN || habitN) msg.push('已排入日程' + (res.diff.changed ? ',调整了 ' + res.diff.changed + ' 个已有块,其余 ' + res.diff.kept + ' 个未改动' : (res.diff.kept ? ',其余 ' + res.diff.kept + ' 个块未改动' : '')));
    if (awayN) msg.push('已标记不可用日' + (aw && aw.moved ? ',' + aw.moved + ' 个块已让位重排' : ''));
    if (inboxN) msg.push(inboxN + ' 项在收件箱');
    if (A.st.settings.aiOn === false && placedN) msg = ['自动排程已关闭:事项在「计划」页的待安排池,可手动放置'];
    if (msg.length) A.toast(msg.join(';'), { undo: A._lastSnap });
    if (res.conflicts.length) setTimeout(() => A.conflictSheet(res.conflicts[0].itemId), 250);
  };

  /* ================= 冲突消解 ================= */
  A.conflictSheet = (itemId) => {
    const it = C.itemOf(A.st, itemId); if (!it) return;
    const opts = C.conflictOptions(A.st, itemId, now());
    const need = C.effMin(it) - C.placedMin(A.st, itemId);
    A.sheet('<h3>「' + esc(it.short) + '」暂时排不下</h3><div class="lead">还差 ' + C.fmtDur(need) + '。不是你的问题,是排程的问题。下面三个选择各自有代价:</div>' +
      (opts.length ? opts.map((o) => '<button class="opt" data-act="opt" data-id="' + itemId + '" data-k="' + o.kind + '"><b>' + esc(o.label) + '</b><span>' + esc(o.note) + '</span></button>').join('') : '<div class="muted">当前没有可行的自动方案。</div>') +
      '<button class="opt" data-act="opt" data-id="' + itemId + '" data-k="drop"><b>放弃这件事</b><span>从日程中移除,不留红色债务</span></button>' +
      '<button class="btn ghost" style="width:100%;margin-top:6px" data-act="close">先放着</button>');
  };
  A.releaseSheet = (d) => {
    d = +d; const st = A.st, t = now();
    const bl = st.blocks.filter((b) => b.start >= d && b.start < C.addDays(d, 1) && !b.skipped && b.itemId && b.kind !== 'commit' && !b.locked && !b.done && b.end > t)
      .sort((a, b) => (b.prio - a.prio) || (C.bmin(b) - C.bmin(a)));
    const un = A.unplaced().filter((i) => i.due && C.dayStart(i.due) === d);
    A.sheet('<h3>' + C.WD[C.dow(d)] + '的释放方案</h3><div class="lead">挑几件挪到别的天,或直接放掉。越早做减法越轻松。</div>' +
      un.map((i) => '<button class="opt" data-act="conflict" data-id="' + i.id + '"><b>「' + esc(i.short) + '」排不下</b><span>看三个选择</span></button>').join('') +
      (bl.length ? bl.map((b) => '<div class="card row between" style="margin-top:8px"><div class="grow"><b>' + esc(b.title) + '</b><div class="small muted">' + hmm(b.start) + ' · ' + C.fmtDur(C.bmin(b)) + ' · P' + b.prio + '</div></div><button class="btn sm" data-act="skip" data-id="' + b.id + '">挪走</button></div>').join('') : (un.length ? '' : '<div class="empty">这天没有可自动挪动的块(会议等承诺块需要你自己决定)。</div>')));
  };

  Object.assign(A, { cardHtml, hmm });
})(window);

</script>
<script>
/* 时序 Chrono · 计划 / 领域 / 回顾 / 设置 / 每日仪式 */
(function (G) {
  'use strict';
  const C = G.Chrono, A = G.A, { MIN, DAY, DOMAINS, DOMAIN_KEYS } = C;
  const { $, esc, now, tint, hmm } = A;
  const S = () => A.st.settings;
  const pt2 = (v) => { const m = String(v || '').match(/^(\d{1,2}):(\d{2})/); return m ? +m[1] * 60 + +m[2] : null; };
  const fmtMD = (ts) => { const d = C.date(ts); return (d.getMonth() + 1) + '月' + d.getDate() + '日'; };

  const zoneNames = { 'Asia/Shanghai': '北京', 'Asia/Taipei': '台北', 'Asia/Hong_Kong': '香港', 'Asia/Tokyo': '东京', 'Asia/Singapore': '新加坡', 'Asia/Kolkata': '新德里', 'Asia/Kathmandu': '加德满都', 'Asia/Dubai': '迪拜', 'Europe/London': '伦敦', 'Europe/Paris': '巴黎', 'America/New_York': '纽约', 'America/Chicago': '芝加哥', 'America/Denver': '丹佛', 'America/Los_Angeles': '洛杉矶', 'Australia/Sydney': '悉尼', 'Pacific/Auckland': '奥克兰', 'UTC': 'UTC' };
  const zoneLabel = (zone) => zoneNames[zone] || zone.replace(/_/g, ' ');
  const zoneOptions = (selected) => {
    const common = Object.keys(zoneNames), all = typeof Intl.supportedValuesOf === 'function' ? Intl.supportedValuesOf('timeZone') : [];
    const options = [...new Set(['system', ...common, selected, ...all].filter(Boolean))];
    return options.map((z) => '<option value="' + esc(z) + '" ' + (z === selected ? 'selected' : '') + '>' + esc(z === 'system' ? '跟随设备 · ' + zoneLabel(C.systemTimeZone()) : zoneLabel(z) + (zoneNames[z] && z !== 'UTC' ? ' · ' + z : '')) + '</option>').join('');
  };

<script>

(function (G) {

      '<circle cx="22" cy="22" r="' + R + '" fill="none" stroke="var(--now)" stroke-width="4" stroke-linecap="round" stroke-dasharray="' + (circ * p) + ' ' + circ + '" transform="rotate(-90 22 22)"/>' +

  function hero(nxt, t) {

      '<div class="ht">' + esc(nxt.title) + '</div><div class="hm"><b>' + hmm(nxt.start) + '</b> – ' + hmm(nxt.end) + '<span>' + C.fmtDur(mins) + (nxt.loc ? ' · ' + esc(nxt.loc) : '') + '</span></div>' +
      (starting ? '<div class="prog"><i style="width:' + Math.round(prog * 100) + '%"></i></div><div class="hs">还剩 ' + C.fmtDur(left) + '</div>' : '') +

  }

  A.viewToday = () => {

<script>

<script>
