name: Build Android APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install Capacitor
        run: npm i --no-save @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
      - name: Web assets
        run: node tools/make_www.js
      - name: Add Android project
        run: npx cap add android
      - name: Launcher icons
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          import os
          src = Image.open('icons/icon-1024.png').convert('RGBA')
          res = 'android/app/src/main/res'
          for d in os.listdir(res):
              if d.startswith('mipmap-anydpi'):
                  for f in os.listdir(os.path.join(res, d)):
                      os.remove(os.path.join(res, d, f))
          for d, sz in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              dd = os.path.join(res, 'mipmap-' + d)
              os.makedirs(dd, exist_ok=True)
              im = src.resize((sz, sz), Image.LANCZOS)
              for n in ('ic_launcher.png', 'ic_launcher_round.png', 'ic_launcher_foreground.png'):
                  im.save(os.path.join(dd, n))
          PY
      - name: Sync
        run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > ../gradle.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -m1 -A25 "What went wrong" ../gradle.log | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')
            [ -z "$msg" ] && msg=$(tail -40 ../gradle.log | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')
            echo "::error title=GRADLE_FAILED::${msg:0:3800}"
            tail -60 ../gradle.log
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gradle-log
          path: gradle.log
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Chrono-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: chrono-android
          path: Chrono-android.apk
      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Chrono-android.apk
          generate_release_notes: true
